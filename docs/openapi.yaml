openapi: 3.1.0
info:
  title: Dispatch API
  version: 1.2.0
  description: Self-hosted notification orchestration, managed connector, and universal ingress API. API-key security applies when CONSOLE_AUTH_ENABLED=true; trusted-local mode is the development default.
servers:
  - url: http://localhost:8090
security:
  - apiKey: []
paths:
  /connect/v1/oauth/{connector}/callback:
    get:
      security: []
      summary: Consume a provider OAuth callback and redirect to the Integrations UI
      parameters:
        - {name: connector, in: path, required: true, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "303": {description: OAuth result redirect}
  /connect/v1/github/setup:
    get:
      security: []
      summary: Complete a state-protected GitHub App installation
      parameters:
        - {name: installation_id, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: setup_action, in: query, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        "303": {description: GitHub installation result redirect}
  /connect/v1/github/events:
    post:
      security: []
      summary: Receive an HMAC-authenticated GitHub App webhook delivery
      parameters:
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string}}
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, additionalProperties: true}}
      responses:
        "202": {description: Delivery accepted and routed}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/connectors:
    get:
      summary: List connector manifests and persisted connections
      responses:
        "200":
          description: Connector catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ConnectorManifest"}}
                  connections: {type: array, items: {$ref: "#/components/schemas/ConnectorConnection"}}
  /api/v1/connectors/{connector}/authorize:
    post:
      summary: Begin a state- and PKCE-protected connector OAuth flow
      parameters:
        - {name: connector, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, recipient_id]
              properties:
                name: {type: string}
                recipient_id: {type: string}
                config:
                  type: object
                  additionalProperties: {type: string}
      responses:
        "200": {description: Provider authorization URL}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/connectors/github/install:
    post:
      summary: Begin a state-protected GitHub App installation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, recipient_id, config]
              properties:
                name: {type: string}
                recipient_id: {type: string}
                config:
                  type: object
                  required: [mode]
                  properties:
                    mode: {type: string, enum: [important, code, work, ci, all]}
      responses:
        "200": {description: GitHub App installation URL}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/connectors/telegram/auth/start:
    post:
      summary: Start Telegram user-account authorization and send a sign-in code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, recipient_id, phone_number]
              properties:
                name: {type: string}
                recipient_id: {type: string}
                phone_number: {type: string, pattern: '^\+[1-9][0-9]{6,14}$'}
      responses:
        "200": {description: Sign-in code requested}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/connectors/telegram/auth/{authID}/code:
    post:
      summary: Verify a Telegram sign-in code
      parameters:
        - {name: authID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string}}
      responses:
        "200": {description: 2FA password required}
        "201": {description: Telegram connection created}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/connectors/telegram/auth/{authID}/password:
    post:
      summary: Verify Telegram two-step authentication and create the connection
      parameters:
        - {name: authID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: {password: {type: string, format: password, writeOnly: true}}
      responses:
        "201": {description: Telegram connection created}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/connections:
    post:
      summary: Verify credentials and create a managed connector connection
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateConnectorConnection"}
      responses:
        "201": {description: Connection created; credentials are not returned}
        "400": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/connections/{id}/test:
    post:
      summary: Recheck credentials and retry connector activation
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: Test result and activation state}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/connections/{id}/sample:
    post:
      summary: Send a sample event through the normal Dispatch delivery pipeline
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "202": {description: Sample notification queued}
  /api/v1/connections/{id}/enabled:
    post:
      summary: Activate or pause a connector and its external subscription
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: {enabled: {type: boolean}}
      responses:
        "204": {description: Lifecycle state updated}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/connections/{id}:
    delete:
      summary: Deactivate and delete a connector connection
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: Disconnected}
        "502": {$ref: "#/components/responses/Error"}
  /ingest/v1/{slug}:
    post:
      security: []
      summary: Authenticate, transform, and idempotently ingest a source event
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "202": {description: Notification created and queued}
        "200": {description: Duplicate event or provider verification response}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/sources:
    get:
      summary: List universal ingress sources and available presets
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/IngressSource"}}
                  providers: {type: array, items: {type: string}}
    post:
      summary: Create a source and return its secret once
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateIngressSource"}
      responses:
        "201": {description: Source created; response includes the one-time secret}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/sources/{id}/rotate-secret:
    post:
      summary: Rotate a source secret and return the new value once
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secret: {type: string, writeOnly: true, description: Required for Slack and Stripe}
      responses:
        "200": {description: Secret rotated}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/sources/{id}/enabled:
    post:
      summary: Enable or disable a source
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: {enabled: {type: boolean}}
      responses:
        "204": {description: Updated}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/sources/{id}/events:
    get:
      summary: List recent accepted events for a source
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: Source event history}
  /api/v1/sources/{id}:
    delete:
      summary: Delete a source and its ingress history
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/notifications:
    get:
      summary: List notifications
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: priority, in: query, schema: {type: string}}
        - {name: channel, in: query, schema: {type: string, enum: [email, telegram, webhook]}}
        - {name: event_type, in: query, schema: {type: string}}
        - {name: ai_fallback, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200": {description: Notification page, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationList"}}}}
    post:
      summary: Idempotently enqueue a notification
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateNotification"}
      responses:
        "202": {description: Created and queued}
        "200": {description: Existing idempotent result}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/notifications/{id}:
    get:
      summary: Get notification, deliveries, attempts, AI records, and audit trail
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: Notification detail}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/notifications/{id}/cancel:
    post:
      summary: Cancel pending work
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"204": {description: Cancelled}, "409": {$ref: "#/components/responses/Error"}}
  /api/v1/notifications/{id}/retry:
    post:
      summary: Retry a failed notification
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"202": {description: Retry queued}, "409": {$ref: "#/components/responses/Error"}}
  /api/v1/recipients:
    get:
      summary: List recipients
      responses: {"200": {description: Recipients}}
    post:
      summary: Create recipient
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Recipient"}}}}
      responses: {"201": {description: Created}, "400": {$ref: "#/components/responses/Error"}}
  /api/v1/recipients/{id}:
    get:
      summary: Get recipient
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Recipient}, "404": {$ref: "#/components/responses/Error"}}
    put:
      summary: Update recipient
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Updated}}
    delete:
      summary: Delete recipient
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"204": {description: Deleted}}
  /api/v1/recipient-setups/mailpit:
    post:
      summary: Start a Mailpit mailbox verification
      responses: {"201": {description: Verification message sent}, "409": {$ref: "#/components/responses/Error"}}
  /api/v1/recipient-setups/mailpit/{id}/verify:
    post:
      summary: Verify a Mailpit code and create the recipient
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"201": {description: Recipient created}, "409": {$ref: "#/components/responses/Error"}}
  /api/v1/recipient-setups/telegram:
    post:
      summary: Start Telegram bot deep-link pairing
      responses: {"201": {description: Pairing link created}, "409": {$ref: "#/components/responses/Error"}}
  /api/v1/recipient-setups/{id}:
    get:
      summary: Read recipient setup status
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Setup status}, "404": {$ref: "#/components/responses/Error"}}
  /api/v1/templates:
    get: {summary: List templates, responses: {"200": {description: Templates}}}
    post: {summary: Create template, responses: {"201": {description: Created}}}
  /api/v1/templates/{id}:
    put: {summary: Update template, parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Updated}}}
    delete: {summary: Delete template, parameters: [{$ref: "#/components/parameters/ID"}], responses: {"204": {description: Deleted}}}
  /api/v1/dashboard:
    get: {summary: Get operational dashboard, responses: {"200": {description: Dashboard}}}
  /api/v1/settings:
    get: {summary: Get non-secret runtime readiness, responses: {"200": {description: Settings}}}
  /api/v1/events:
    get:
      summary: Stream audit events with server-sent events
      responses: {"200": {description: Event stream, content: {text/event-stream: {schema: {type: string}}}}}
  /api/v1/ai/preview:
    post:
      summary: Preview AI classification and summary
      responses: {"200": {description: Decision}, "503": {$ref: "#/components/responses/Error"}}
components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required: [code, message]
                properties: {code: {type: string}, message: {type: string}}
  schemas:
    ConnectorField:
      type: object
      required: [name, label, type, required, secret]
      properties:
        name: {type: string}
        label: {type: string}
        type: {type: string}
        required: {type: boolean}
        secret: {type: boolean}
        placeholder: {type: string}
        help: {type: string}
    ConnectorManifest:
      type: object
      required: [id, name, summary, category, auth, transport, availability, configured, capabilities, fields]
      properties:
        id: {type: string}
        name: {type: string}
        summary: {type: string}
        category: {type: string}
        auth: {type: string, enum: [none, user_session, oauth2, app_install, api_key]}
        transport: {type: string, enum: [internal, webhook, gateway, polling]}
        availability: {type: string, enum: [available, setup_required, limited, unavailable]}
        configured: {type: boolean}
        capabilities: {type: array, items: {type: string}}
        fields: {type: array, items: {$ref: "#/components/schemas/ConnectorField"}}
        setup_hint: {type: string}
        documentation: {type: string}
        authorization_url: {type: string, format: uri}
    CreateConnectorConnection:
      type: object
      required: [connector_id, name, recipient_id]
      properties:
        connector_id: {type: string}
        name: {type: string}
        recipient_id: {type: string}
        config: {type: object, additionalProperties: {type: string}}
        credentials:
          type: object
          writeOnly: true
          additionalProperties: {type: string}
    ConnectorConnection:
      type: object
      required: [id, connector_id, name, recipient_id, status, config, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        connector_id: {type: string}
        name: {type: string}
        recipient_id: {type: string}
        status: {type: string, enum: [connected, action_required, error, disabled]}
        account_label: {type: string}
        config: {type: object, additionalProperties: {type: string}}
        token_expires_at: {type: [string, "null"], format: date-time}
        last_tested_at: {type: [string, "null"], format: date-time}
        last_event_at: {type: [string, "null"], format: date-time}
        last_error: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    IngressMapping:
      type: object
      properties:
        id_path: {type: string, example: id}
        event_type_path: {type: string, example: event_type}
        subject_path: {type: string, example: subject}
        body_path: {type: string, example: body}
        default_event_type: {type: string}
        default_subject: {type: string}
        requested_channels:
          type: array
          deprecated: true
          description: Legacy field retained for compatibility; delivery uses the selected recipient destination.
          uniqueItems: true
          items: {type: string, enum: [email, telegram, webhook]}
    CreateIngressSource:
      type: object
      required: [name, slug, provider, recipient_id]
      properties:
        name: {type: string}
        slug: {type: string, pattern: "^[a-z0-9][a-z0-9-]{2,62}$"}
        provider: {type: string, enum: [generic, github, gitlab, discord, slack, stripe, sentry, grafana]}
        recipient_id: {type: string}
        auth_mode: {type: string, enum: [bearer, header, hmac_sha256, slack_signature, stripe_signature]}
        auth_header: {type: string}
        secret: {type: string, writeOnly: true, description: Required when importing a Slack or Stripe signing secret}
        mapping: {$ref: "#/components/schemas/IngressMapping"}
    IngressSource:
      allOf:
        - {$ref: "#/components/schemas/CreateIngressSource"}
        - type: object
          required: [id, enabled, created_at, updated_at]
          properties:
            id: {type: string}
            signature_header: {type: string, readOnly: true}
            enabled: {type: boolean}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    CreateNotification:
      type: object
      required: [idempotency_key, recipient_id, event_type, body]
      properties:
        idempotency_key: {type: string, maxLength: 200}
        recipient_id: {type: string}
        event_type: {type: string}
        subject: {type: string, maxLength: 200}
        body: {type: string, maxLength: 100000}
        metadata: {type: object, additionalProperties: true}
        requested_channels:
          type: array
          deprecated: true
          description: Legacy field retained for compatibility; delivery uses the selected recipient destination.
          items: {type: string, enum: [email, telegram, webhook]}
          uniqueItems: true
        scheduled_at: {type: [string, "null"], format: date-time}
    Notification:
      allOf:
        - {$ref: "#/components/schemas/CreateNotification"}
        - type: object
          required: [id, status, priority, created_at, updated_at]
          properties:
            id: {type: string}
            status: {type: string}
            priority: {type: string}
            category: {type: string}
            summary: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    NotificationList:
      type: object
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Notification"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
    Recipient:
      type: object
      required: [name, destination_type, preferences]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string}
        destination_type: {type: string, enum: [email, telegram, mailpit, webhook]}
        destination_label: {type: string}
        email: {type: string, format: email}
        telegram_chat_id: {type: string}
        webhook_url: {type: string, format: uri}
        preferences: {type: object, additionalProperties: true}
