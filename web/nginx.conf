server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker can assign a new IP to the API container after it is recreated.
  # Resolve the service name at request time instead of caching its startup IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  location /api/ { proxy_pass $api_upstream; proxy_set_header Host $host; }
  location /ingest/ { proxy_pass $api_upstream; proxy_set_header Host $host; }
  location /connect/ { proxy_pass $api_upstream; proxy_set_header Host $host; }
  location /healthz { proxy_pass $api_upstream; }
  location /readyz { proxy_pass $api_upstream; }
  location /metrics { proxy_pass $api_upstream; }
  location / { try_files $uri /index.html; }
}
