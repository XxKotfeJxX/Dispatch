name: Bug report
description: Report a reproducible Dispatch defect
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes: {value: "Remove notification content, addresses, and credentials before submitting."}
  - type: input
    id: version
    attributes: {label: Version, placeholder: v1.0.0}
    validations: {required: true}
  - type: textarea
    id: behavior
    attributes: {label: Observed behavior}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
