name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.x"}
      - run: |
          mkdir dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X dispatch/internal/buildinfo.Version=${GITHUB_REF_NAME}" -o dist/dispatch-api-linux-amd64 ./cmd/api
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X dispatch/internal/buildinfo.Version=${GITHUB_REF_NAME}" -o dist/dispatch-worker-linux-amd64 ./cmd/worker
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X dispatch/internal/buildinfo.Version=${GITHUB_REF_NAME}" -o dist/dispatch-discord-bridge-linux-amd64 ./cmd/discord-bridge
          sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
