name: dispatch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dispatch-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${DISPATCH_VERSION:-dev}
    command: ["/usr/local/bin/dispatch-api"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch?sslmode=disable
      API_ADDR: :8080
      CONSOLE_AUTH_ENABLED: ${CONSOLE_AUTH_ENABLED:-false}
      API_KEY: ${API_KEY:-dispatch-local-development-key}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8090}
      DEMO_SEED: ${DEMO_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${DISPATCH_VERSION:-dev}
    command: ["/usr/local/bin/dispatch-worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch?sslmode=disable
      WORKER_ID: dispatch-worker-compose
      AI_ENABLED: ${AI_ENABLED:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:80"
    restart: unless-stopped

  discord-bridge:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${DISPATCH_VERSION:-dev}
    command: ["/usr/local/bin/dispatch-discord-bridge"]
    env_file:
      - path: .env
        required: false
    environment:
      DISCORD_INTERNAL_URL: http://api:8080/internal/v1/discord/events
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  github-smee:
    profiles: ["github-dev"]
    image: node:22-alpine
    command:
      - sh
      - -c
      - >-
        test -n "$$GITHUB_SMEE_URL" &&
        npx --yes --package=smee-client smee
        -u "$$GITHUB_SMEE_URL"
        -t http://api:8080/connect/v1/github/events
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  dispatch-postgres:
